rootProject.name = "carbon-client"
plugins {
    kotlin("jvm") version "1.9.10"
    id("fabric-loom") version "1.3-SNAPSHOT"
}

group = "com.clientcreator4mc"
version = "1.0.0"

repositories {
    mavenCentral()
    maven { url = uri("https://maven.fabricmc.net/") }
}

dependencies {
    minecraft("com.mojang:minecraft:1.21.7")
    mappings("net.fabricmc:yarn:1.21.7+build.4:v2")
    modImplementation("net.fabricmc:fabric-loader:0.14.19")
    modImplementation("net.fabricmc.fabric-api:fabric-api:0.89.6+1.21.7")
}

java {
    toolchain { languageVersion.set(JavaLanguageVersion.of(17)) }
}

loom {
    runs {
        named("client") {
            client()
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
